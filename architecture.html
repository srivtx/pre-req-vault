<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anchor Vault - Architecture Diagram</title>
<style>
  :root{ --bg:#f4f6fb; --ink:#16202e; --muted:#5b6675; --line:#dde3ee; --blue:#1f6feb; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:32px 20px 56px}
  header{max-width:1200px;width:100%}
  h1{font-size:26px;margin:0 0 4px}
  header p{color:var(--muted);margin:0 0 22px;font-size:15px}
  .wrap{max-width:1200px;width:100%}
  img{width:100%;height:auto;border:1px solid var(--line);border-radius:14px;background:#fff;display:block}
  footer{max-width:1200px;width:100%;margin-top:18px;font-size:14px;color:var(--muted)}
  footer a{color:var(--blue);text-decoration:none}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>
  <header>
    <h1>Anchor Vault — Architecture Diagram</h1>
    <p>Programs own their accounts; the user signs; withdraw makes one cross-program call (CPI) into the registration program.</p>
  </header>
  <div class="wrap">
    <img src="architecture-diagram.svg" alt="Anchor Vault architecture diagram" />
  </div>
  <footer>
    From the Turbin3 prerequisite vault. Full write-up and slide deck in the
    <a href="https://github.com/srivtx/pre-req-vault">repository</a>.
  </footer>
</body>
</html>
