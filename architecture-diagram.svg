<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="930" viewBox="0 0 1180 930" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aSlate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#0a9d63"/></marker>
    <marker id="aPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#7a3ff2"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="930" fill="#f4f6fb"/>
  <text x="40" y="40" font-size="22" font-weight="800" fill="#7a3ff2">Anchor Vault - Architecture</text>
  <text x="40" y="62" font-size="13" fill="#5b6675">Programs (stateless) own accounts; PDAs have no private key; withdraw CPIs into the registration program.</text>

  <!-- ================= BAND 1: PROGRAMS ================= -->
  <text x="40" y="100" font-size="13" font-weight="700" fill="#5b6675">PROGRAMS (stateless code)</text>

  <rect x="60" y="112" width="340" height="84" rx="12" fill="#f1ebfe" stroke="#cdbcf7" stroke-width="1.5"/>
  <text x="80" y="144" font-size="15" font-weight="700" fill="#16202e">Vault program (ours)</text>
  <text x="80" y="164" font-size="10" fill="#5b6675">2RFyzJKvv16zuzPbE9KuNv8GZBXtVEDAMtCdR54H7L9n</text>

  <rect x="470" y="112" width="340" height="84" rx="12" fill="#f1ebfe" stroke="#cdbcf7" stroke-width="1.5"/>
  <text x="490" y="144" font-size="15" font-weight="700" fill="#16202e">Registration program (external)</text>
  <text x="490" y="164" font-size="10" fill="#5b6675">TRBZyQHB3m68FGeVsqTK39Wm4xejadjVhP5MAZaKWDM</text>

  <rect x="880" y="112" width="240" height="84" rx="12" fill="#f1ebfe" stroke="#cdbcf7" stroke-width="1.5"/>
  <text x="900" y="144" font-size="15" font-weight="700" fill="#16202e">System Program</text>
  <text x="900" y="164" font-size="10" fill="#5b6675">11111111111111111111111111111111</text>

  <!-- ownership arrows: program -> its accounts -->
  <line x1="230" y1="196" x2="405" y2="252" stroke="#7a3ff2" stroke-width="2" marker-end="url(#aPurple)"/>
  <line x1="230" y1="196" x2="665" y2="252" stroke="#7a3ff2" stroke-width="2" marker-end="url(#aPurple)"/>
  <line x1="640" y1="196" x2="1000" y2="252" stroke="#7a3ff2" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="300" y="222" font-size="10" fill="#7a3ff2">owns</text>
  <text x="560" y="222" font-size="10" fill="#7a3ff2">owns</text>
  <text x="760" y="222" font-size="10" fill="#7a3ff2">owns</text>

  <!-- ================= BAND 2: ACCOUNTS ================= -->
  <text x="40" y="240" font-size="13" font-weight="700" fill="#5b6675">ACCOUNTS (where state lives)</text>

  <rect x="40" y="252" width="210" height="140" rx="12" fill="#e8f1ff" stroke="#bcd5ff" stroke-width="1.5"/>
  <text x="60" y="280" font-size="14" font-weight="700" fill="#16202e">user (wallet)</text>
  <text x="60" y="304" font-size="11" fill="#5b6675">- signs every transaction</text>
  <text x="60" y="324" font-size="11" fill="#5b6675">- pays rent on init</text>
  <text x="60" y="344" font-size="11" fill="#5b6675">- funds the registration</text>
  <text x="60" y="364" font-size="11" fill="#5b6675">  record (rent)</text>

  <rect x="300" y="252" width="210" height="140" rx="12" fill="#e6f8f0" stroke="#bfe9d4" stroke-width="1.5"/>
  <text x="320" y="280" font-size="14" font-weight="700" fill="#16202e">vault_state (PDA)</text>
  <text x="320" y="304" font-size="11" fill="#5b6675">seeds: ['state', user]</text>
  <text x="320" y="326" font-size="11" fill="#5b6675">data: vault_bump,</text>
  <text x="320" y="344" font-size="11" fill="#5b6675">       state_bump</text>
  <text x="320" y="366" font-size="11" fill="#5b6675">owner: Vault program</text>

  <rect x="560" y="252" width="210" height="140" rx="12" fill="#e6f8f0" stroke="#bfe9d4" stroke-width="1.5"/>
  <text x="580" y="280" font-size="14" font-weight="700" fill="#16202e">vault (PDA)</text>
  <text x="580" y="304" font-size="11" fill="#5b6675">seeds: ['vault',</text>
  <text x="580" y="322" font-size="11" fill="#5b6675">        vault_state]</text>
  <text x="580" y="344" font-size="11" fill="#5b6675">holds deposited SOL</text>
  <text x="580" y="366" font-size="11" fill="#5b6675">owner: Vault program</text>

  <rect x="860" y="252" width="280" height="140" rx="12" fill="#e6f8f0" stroke="#bfe9d4" stroke-width="1.5"/>
  <text x="880" y="280" font-size="14" font-weight="700" fill="#16202e">application_account (PDA)</text>
  <text x="880" y="304" font-size="11" fill="#5b6675">under Registration program</text>
  <text x="880" y="326" font-size="11" fill="#5b6675">seeds: ['prereqs', user]</text>
  <text x="880" y="348" font-size="11" fill="#5b6675">stores github username</text>
  <text x="880" y="370" font-size="11" fill="#5b6675">(created by the CPI)</text>

  <!-- ================= BAND 3: INSTRUCTIONS ================= -->
  <text x="40" y="438" font-size="13" font-weight="700" fill="#5b6675">INSTRUCTION LIFECYCLE (one signed transaction each)</text>

  <rect x="40" y="452" width="235" height="92" rx="12" fill="#fff7e6" stroke="#f0d79a" stroke-width="1.5"/>
  <text x="60" y="480" font-size="14" font-weight="700" fill="#16202e">1 - initialize</text>
  <text x="60" y="502" font-size="11" fill="#5b6675">creates vault_state</text>
  <text x="60" y="520" font-size="11" fill="#5b6675">+ vault PDAs (0 SOL)</text>
  <text x="60" y="538" font-size="11" fill="#5b6675">uses: user</text>

  <rect x="320" y="452" width="235" height="92" rx="12" fill="#fff7e6" stroke="#f0d79a" stroke-width="1.5"/>
  <text x="340" y="480" font-size="14" font-weight="700" fill="#16202e">2 - deposit(amount)</text>
  <text x="340" y="502" font-size="11" fill="#5b6675">CPI -> System Program</text>
  <text x="340" y="520" font-size="11" fill="#5b6675">user -> vault SOL</text>
  <text x="340" y="538" font-size="11" fill="#5b6675">uses: user, vault_state, vault</text>

  <rect x="600" y="452" width="255" height="92" rx="12" fill="#fff7e6" stroke="#f0d79a" stroke-width="1.5"/>
  <text x="620" y="480" font-size="14" font-weight="700" fill="#16202e">3 - withdraw(amount)</text>
  <text x="620" y="502" font-size="11" fill="#5b6675">vault PDA signs: vault->user</text>
  <text x="620" y="520" font-size="11" fill="#5b6675">+ CPI -> registration</text>
  <text x="620" y="538" font-size="11" fill="#5b6675">uses: + application_*</text>

  <rect x="900" y="452" width="200" height="92" rx="12" fill="#fff7e6" stroke="#f0d79a" stroke-width="1.5"/>
  <text x="920" y="480" font-size="14" font-weight="700" fill="#16202e">4 - close</text>
  <text x="920" y="502" font-size="11" fill="#5b6675">drain vault,</text>
  <text x="920" y="520" font-size="11" fill="#5b6675">delete vault_state</text>
  <text x="920" y="538" font-size="11" fill="#5b6675">(rent refunded)</text>

  <line x1="275" y1="498" x2="318" y2="498" stroke="#475569" stroke-width="2" marker-end="url(#aSlate)"/>
  <line x1="555" y1="498" x2="598" y2="498" stroke="#475569" stroke-width="2" marker-end="url(#aSlate)"/>
  <line x1="855" y1="498" x2="898" y2="498" stroke="#475569" stroke-width="2" marker-end="url(#aSlate)"/>

  <!-- ================= CPI BRANCH ================= -->
  <line x1="727" y1="544" x2="727" y2="612" stroke="#0a9d63" stroke-width="3" marker-end="url(#aGreen)"/>
  <rect x="600" y="612" width="330" height="70" rx="12" fill="#e6f8f0" stroke="#bfe9d4" stroke-width="1.5"/>
  <text x="620" y="640" font-size="13" font-weight="700" fill="#0a9d63">CPI -&gt; Registration.initialize(github)</text>
  <text x="620" y="662" font-size="11" fill="#5b6675">user is signer (status propagates);</text>
  <text x="620" y="678" font-size="11" fill="#5b6675">creates application_account</text>

  <line x1="765" y1="682" x2="765" y2="720" stroke="#0a9d63" stroke-width="3" marker-end="url(#aGreen)"/>
  <rect x="560" y="720" width="470" height="58" rx="12" fill="#e6f8f0" stroke="#bfe9d4" stroke-width="1.5"/>
  <text x="580" y="746" font-size="13" font-weight="700" fill="#0a9d63">Result: application_account written</text>
  <text x="580" y="768" font-size="11" fill="#5b6675">github = 'srivtx'  (PDA seeds ['prereqs', user])</text>

  <!-- ================= LEGEND ================= -->
  <line x1="60" y1="830" x2="110" y2="830" stroke="#7a3ff2" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="120" y="834" font-size="11" fill="#5b6675">program owns / can write account</text>
  <line x1="380" y1="830" x2="430" y2="830" stroke="#475569" stroke-width="2" marker-end="url(#aSlate)"/>
  <text x="440" y="834" font-size="11" fill="#5b6675">instruction flow</text>
  <line x1="600" y1="830" x2="650" y2="830" stroke="#0a9d63" stroke-width="3" marker-end="url(#aGreen)"/>
  <text x="660" y="834" font-size="11" fill="#5b6675">CPI call (cross-program invocation)</text>

  <text x="40" y="876" font-size="12" fill="#16202e"><tspan font-weight="700">Key idea:</tspan> Programs = functions - Accounts = mutable args - PDAs = addresses only the program can authorize - CPI = one program calling another inside the same transaction.</text>
</svg>
